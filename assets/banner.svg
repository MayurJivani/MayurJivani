<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Mayur Jivani, Futile Studio</title>
  <desc id="d">Dark banner with the name Mayur Jivani in heavy type on a lime block, and the line: everything is futile, do it anyway.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c1c1c" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6ff00" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff3ea5" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="#0b0b0b"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8a8a80" letter-spacing="2">
    <text x="64" y="66">FUTILE STUDIO</text>
    <text x="1136" y="66" text-anchor="end">GAMES / TOOLS / ODD EXPERIMENTS</text>
  </g>
  <line x1="64" y1="84" x2="1136" y2="84" stroke="#2a2a2a" stroke-width="1"/>

  <rect x="76" y="132" width="760" height="124" fill="#ff3ea5"/>
  <rect x="64" y="120" width="760" height="124" fill="#c6ff00" stroke="#0b0b0b" stroke-width="4"/>
  <text x="92" y="212" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="78" fill="#0b0b0b" letter-spacing="-2">MAYUR JIVANI</text>

  <text x="64" y="304" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#f3f0e6">Everything is futile. Do it anyway.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#c6ff00" letter-spacing="2">
    <text x="1136" y="304" text-anchor="end">FUTILE.STUDIO</text>
  </g>
  <circle cx="1100" cy="178" r="46" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <circle cx="1100" cy="178" r="8" fill="#c6ff00"/>
  <line x1="1100" y1="132" x2="1100" y2="224" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="1054" y1="178" x2="1146" y2="178" stroke="#2a2a2a" stroke-width="2"/>
</svg>
