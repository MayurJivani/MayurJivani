name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0b0b0b&color_dots=#ebedf0,#e8ffb0,#c6ff00,#8fbf00,#4d6b00
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff3ea5&color_dots=#161b22,#2b3a00,#5c7a00,#94c400,#c6ff00
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
